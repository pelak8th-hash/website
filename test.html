<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17130b">
<title>باز کردن پلاک هشتم</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f6edd7;background:radial-gradient(ellipse at top,#332814 0%,#17130b 48%,#090806 100%);font-family:Tahoma,Arial,sans-serif}
main{width:min(100%,440px);padding:32px 24px;text-align:center;border:1px solid rgba(214,177,91,.42);border-radius:22px;background:rgba(17,14,9,.9);box-shadow:0 18px 55px rgba(0,0,0,.38)}
h1{margin:0 0 12px;color:#e3c16f;font-size:26px;font-weight:500;line-height:1.8}
.address{direction:ltr;color:#d9b45e;font-size:16px;letter-spacing:1px;margin-bottom:24px}
p{margin:0 0 20px;line-height:2;color:#e3dccb;font-size:13px}
.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;padding:12px 16px;border-radius:12px;font:inherit;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid #d9b45e}
.primary{background:linear-gradient(135deg,#e7ca7b,#b78b35);color:#171109;font-weight:bold}
.secondary{margin-top:10px;background:transparent;color:#e8d8ad}
.note{margin-top:16px;color:#aaa08a;font-size:12px;line-height:1.9}
</style>
</head>
<body>
<main>
<h1>کافه کتاب پلاک هشتم</h1>
<div class="address">pelak8th.ir</div>
<p>اگر این صفحه را داخل ایتا یا سروش می‌بینید، می‌توانید تلاش کنید سایت در Chrome باز شود.</p>
<a class="button primary" id="openChrome" href="intent://pelak8th.ir/#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=https%3A%2F%2Fpelak8th.ir%2F;end">باز کردن در Chrome</a>
<a class="button secondary" href="https://pelak8th.ir/">ادامه در همین مرورگر</a>
<div class="note">مرورگرهای داخلی ممکن است باز کردن برنامه دیگر را محدود کنند. برای حفظ کنترل کاربر، باز شدن مرورگر خارجی با زدن دکمه انجام می‌شود.</div>
</main>
<script>
// تلاش خودکار ممکن است توسط مرورگر داخلی مسدود شود؛ در این حالت دکمه‌ها باقی می‌مانند.
(function(){
 const ua=navigator.userAgent||'';
 if(!/(eitaa|soroush|splus)/i.test(ua))return;
 // از تلاش خودکار برای پرش به برنامه دیگر استفاده نمی‌کنیم؛ سیستم‌عامل‌ها معمولاً
 // باز کردن برنامه خارجی را بدون اقدام صریح کاربر مسدود می‌کنند.
})();
</script>
</body>
</html>
